<head>

    <title>TIN HỌC VĂN PHÒNG</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }
        header {
            background: pink;
            color: black;
            padding: 18px 7%;
            display: flex;
            justify-content:right;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .tieude{
            font-size: 28px;
            font-weight: bold;
        }
        .tieude span{
            color: red;
        }
        nav {
            height: 50px;
            display: flex;
            gap: 20px;
            background-color: white;
            box-shadow: 2px 5px 10px gray;
        }
        nav a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: larger;
            border-top: 0px;
            padding:10px ;
            align-items: center;
        }
        nav a:hover {
            background-color: aqua;
            color: #38bdf8;
            gap: 20px;
            border-radius: 10px;
        }     
        section {
            padding: 70px 7%;
        }
        .title {
            text-align: center;
            margin-bottom: 20px;
        }
        .title h2 {
            font-size: 36px;
            color: #0f172a;
        }
        .video {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 10px;
            border-radius: 18px;
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .video figure {
            margin: 0;
        }
        .video img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0px 5px 10px gray;
            transition: 0.3s;
        }
        .video img:hover {
            transform: scale(1.03);
        }
        .video figcaption {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #0f172a;
        }
        footer {
            background: pink;
            color: rgb(0, 0, 0);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
        }
    </style>
</head>
