    <title>TIN HỌC VĂN PHÒNG</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }
        header {
            background: pink;
            color: black;
            padding: 18px 7%;
            display: flex;
            justify-content:right;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .tieude{
            font-size: 28px;
            font-weight: bold;
        }
        .tieude span{
            color: red;
        }
        nav {
            height: 50px;
            display: flex;
            gap: 20px;
            background-color: white;
            box-shadow: 2px 5px 10px gray;
        }
        nav a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: larger;
            border-top: 0px;
            padding:10px ;
            align-items: center;
        }
        nav a:hover {
            background-color: aqua;
            color: #38bdf8;
            gap: 20px;
            border-radius: 10px;
        }     
        section {
            padding: 70px 7%;
        }
        .title {
            text-align: center;
            margin-bottom: 20px;
        }
        .title h2 {
            font-size: 36px;
            color: #0f172a;
        }
        .video {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 10px;
            border-radius: 18px;
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .video figure {
            margin: 0;
        }
        .video img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0px 5px 10px gray;
            transition: 0.3s;
        }
        .video img:hover {
            transform: scale(1.03);
        }
        .video figcaption {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #0f172a;
        }
        footer {
            background: pink;
            color: rgb(0, 0, 0);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
        }
        nav a.active {
            background-color: #38bdf8;
            color: white;
            border-radius: 10px;
        }
        .video img {
            cursor: pointer;
        }
        .video-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            background: rgba(15,23,42,0.75);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            pointer-events: none;
        }
        .video figure {
            position: relative;
        }
        #modal-video {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #modal-video.mo {
            display: flex;
        }
        .modal-video-khung {
            width: 100%;
            max-width: 800px;
            background: black;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .modal-video-khung iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            display: block;
        }
        .modal-dong {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="../theme.css">
</head>

<script src="../site.js"></script>
<script>
    (function () {
        const modal = document.getElementById("modal-video");
        const iframe = document.getElementById("modal-iframe");
        const nutDong = document.getElementById("modal-dong");

        document.querySelectorAll(".video-play").forEach((a) => {
            a.addEventListener("click", (e) => {
                e.preventDefault();
                const id = a.dataset.yt;
                iframe.src = "https://www.youtube.com/embed/" + id + "?autoplay=1";
                modal.classList.add("mo");
            });
        });

        function dongModal() {
            modal.classList.remove("mo");
            iframe.src = "";
        }

        nutDong.addEventListener("click", dongModal);
        modal.addEventListener("click", (e) => {
            if (e.target === modal) dongModal();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") dongModal();
        });
    })();
</script>
