<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TIN HỌC VĂN PHÒNG</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }
        header {
            background: pink;
            color: black;
            padding: 18px 7%;
            display: flex;
            justify-content: right;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .tieude{
            font-size: 28px;
            font-weight: bold;
        }
        .tieude span{
            color: red;
        }
         nav {
            height: 50px;
            display: flex;
            gap: 20px;
            background-color: white;
            box-shadow: 2px 5px 10px gray;
        }
        nav a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: larger;
            border-top: 0px;
            padding:10px ;
            align-items: center;
        }
        nav a:hover {
            background-color: aqua;
            color: #38bdf8;
            gap: 20px;
            border-radius: 10px;
        }
        .trangchu {
            height: 550px;
            padding: 80px 7%;
            display: grid;
            align-items: center;
            gap: 50px;
        }
        .trangchu h1 {
            font-size: 60px;
            line-height: 1.1;
            color: #0f172a;
            margin: 15px 0;
        }
        .trangchu h1 span {
            color: #2563eb;
        }
        .trangchu p {
            font-size: 19px;
            color: #475569;
            width: 650px;
        }
        .bđ {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
        .bđ:hover {
            background: #1d4ed8;
            color: yellow;
        }       
        section {
            padding: 70px 7%;
        }
        .title {
            text-align: center;
            margin-bottom: 20px;
        }
        .title h2 {
            font-size: 36px;
            color: #0f172a;
        }
        .anh {
            display: grid;
            grid-template-columns:auto auto auto;
            gap: 20px;
            
        }
        .anh img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.3s;
        }
        .anh img:hover {
            transform: scale(1.2);
        }
        .anh figure {
            margin: 0;
        }
        .anh figcaption {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
            color: #475569;
        }
        .nhom-title {
            font-size: 22px;
            color: #0f172a;
            margin: 45px 0 18px;
        }
        .nhom-title:first-of-type {
            margin-top: 0;
        }
        footer {
            background: pink;
            color: rgb(0, 0, 0);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
        }
        nav a.active {
            background-color: #38bdf8;
            color: white;
            border-radius: 10px;
        }
        .anh figure {
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .anh figure.hien {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
    <link rel="stylesheet" href="../theme.css">
</head>

<script src="../site.js"></script>
<script>
    (function () {
        const figures = document.querySelectorAll(".anh figure");
        const quanSat = new IntersectionObserver((entries, obs) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("hien");
                    obs.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        figures.forEach((f) => quanSat.observe(f));
    })();
</script>
